<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>KS Sierosław – oficjalna strona klubu piłkarskiego</title>
<meta name="description" content="KS Sierosław – oficjalna strona klubu piłkarskiego. Terminarz meczów, kalendarz treningów, aktualności i galeria klubowa.">
<meta name="keywords" content="KS Sierosław, klub piłkarski Sierosław, piłka nożna Sierosław, KS Sierosław 2017">
<meta name="robots" content="index, follow">
<meta property="og:title" content="KS Sierosław">
<meta property="og:description" content="Oficjalna strona klubu piłkarskiego KS Sierosław – mecze, kalendarz, aktualności i galeria.">
<meta property="og:type" content="website">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsClub",
  "name": "KS Sierosław",
  "sport": "Piłka nożna",
  "areaServed": "Sierosław"
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-deep:#0e3d1f;
  --green:#166534;
  --green-bright:#1e8a45;
  --gold:#f4c430;
  --gold-deep:#d9a600;
  --paper:#f7f5ee;
  --ink:#0e1f14;
  --ink-soft:#3c4a40;
  --line:#c9c2ab;
  --white:#ffffff;
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1a12;
    --ink:#eef2ea;
    --ink-soft:#aab7ad;
    --line:#2a3b2d;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1a12;
  --ink:#eef2ea;
  --ink-soft:#aab7ad;
  --line:#2a3b2d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, rgba(22,101,52,.08) 1px, transparent 0) 0 0/22px 22px,
    var(--paper);
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.num{
  font-family:'Oswald',system-ui,sans-serif;
  letter-spacing:0.01em;
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
.hide{display:none !important;}
img{max-width:100%;display:block;}

/* ---------- pitch background ---------- */
.pitch-bg{
  background:
    repeating-linear-gradient(
      100deg,
      var(--green) 0px, var(--green) 90px,
      var(--green-bright) 90px, var(--green-bright) 180px
    );
  position:relative;
}
.pitch-bg::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(14,61,31,0.15), rgba(14,61,31,0.55));
  pointer-events:none;
}

/* ================= SPLASH / HERO SCENE ================= */
#scene{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:8vh 1.2rem 3rem;
  overflow:hidden;
}
.crest{
  width:84px;height:107px;margin-bottom:.6rem;
  object-fit:contain;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));
}
.club-name{
  color:var(--white);
  text-align:center;
  font-size:clamp(1.6rem,7vw,2.4rem);
  font-weight:700;
  text-transform:none;
  line-height:1.05;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}
.club-sub{
  color:var(--gold);
  font-size:.95rem;
  letter-spacing:.06em;
  margin-top:.35rem;
  font-family:'Oswald',sans-serif;
}
.stage{
  position:relative;
  width:min(90vw,360px);
  height:300px;
  margin-top:2.2rem;
}
#playerSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.stage-caption{
  color:rgba(255,255,255,.75);font-size:.82rem;font-style:italic;
  text-align:center;margin-top:.6rem;letter-spacing:.02em;
}

.eye{transform-box:fill-box;transform-origin:50% 50%;animation:glance 2.6s ease-in-out infinite;}
.eye-right{animation-delay:.05s;}
@keyframes glance{
  0%,55%,100%{transform:translate(0,0)}
  62%{transform:translate(.6px,.9px)}
  75%{transform:translate(-.4px,.4px)}
}

.leg{transform-box:fill-box;transform-origin:50% 0%;}
.leg-left{animation:legL 0.62s ease-in-out infinite;}
.leg-right{animation:legR 0.62s ease-in-out infinite;}
@keyframes legL{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes legR{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-14deg)}}
.torso{animation:bob .62s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

#ballWrap{transform-box:fill-box;transform-origin:50% 50%;animation:juggle 0.62s ease-in-out infinite;}
@keyframes juggle{
  0%{transform:translateY(0) scale(1,1)}
  38%{transform:translateY(-62px) scale(0.97,1.03)}
  72%{transform:translateY(0) scale(1.08,0.9)}
  100%{transform:translateY(0) scale(1,1)}
}
#groundShadow{transition:opacity .3s ease;}

/* faza 1: mocne podbicie – sylwetka znika, "kamera" zostaje tylko na piłce */
.stage.kicking .leg,.stage.kicking .torso{animation:none !important;opacity:0;transform:scale(.9) translateY(10px);transition:opacity .38s ease, transform .38s ease;}
.stage.kicking #groundShadow{opacity:0;}
.stage.kicking #ballWrap{animation:riseZoom .62s cubic-bezier(.22,.7,.3,1) forwards;}
@keyframes riseZoom{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  100%{transform:translate(-6px,-120px) scale(1.65) rotate(250deg)}
}

/* faza 2: piłka (sama, w zbliżeniu) opada w dół */
.stage.falling .leg,.stage.falling .torso{opacity:0;}
.stage.falling #groundShadow{opacity:0;}
.stage.falling #ballWrap{animation:fallZoom .68s cubic-bezier(.5,0,.68,1) forwards;}
@keyframes fallZoom{
  0%{transform:translate(-6px,-120px) scale(1.65) rotate(250deg)}
  100%{transform:translate(0,0) scale(1) rotate(430deg)}
}

/* faza 3: odbicie od ziemi – dokładnie wtedy pojawia się panel logowania */
.stage.bouncing .leg,.stage.bouncing .torso{opacity:0;}
.stage.bouncing #groundShadow{opacity:1;}
.stage.bouncing #ballWrap{animation:bounceImpact .5s cubic-bezier(.3,1.4,.4,1) forwards;}
@keyframes bounceImpact{
  0%{transform:translate(0,0) scale(1,1) rotate(430deg)}
  22%{transform:translate(0,3px) scale(1.2,.76) rotate(438deg)}
  55%{transform:translate(0,-15px) scale(.92,1.08) rotate(450deg)}
  100%{transform:translate(0,0) scale(1,1) rotate(460deg)}
}

.stage.settled .leg,.stage.settled .torso{opacity:0;}
.stage.settled #groundShadow{opacity:1;}
.stage.settled #ballWrap{animation:idleFloat 1.7s ease-in-out infinite;}
@keyframes idleFloat{0%,100%{transform:translate(0,0) rotate(460deg)}50%{transform:translate(0,-5px) rotate(460deg)}}

#gate{
  width:min(94vw,380px);
  margin-top:1.6rem;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .5s ease, transform .5s ease;
}
#gate.show{opacity:1;transform:translateY(0);}

.ticket{
  background:var(--paper);
  border-radius:16px;
  padding:1.3rem 1.2rem 1.4rem;
  box-shadow:0 14px 34px rgba(0,0,0,.32);
  position:relative;
  border-top:3px solid var(--gold);
}
.ticket::before,.ticket::after{
  content:"";position:absolute;top:50%;width:18px;height:18px;
  background:#0e3d1f;border-radius:50%;transform:translateY(-50%);
}
.ticket::before{left:-9px;}
.ticket::after{right:-9px;}
.ticket + .ticket{margin-top:1rem;}
.gate-title{
  font-size:1.05rem;font-weight:600;color:var(--ink);
  text-align:center;margin-bottom:1rem;
}
.btn{
  display:block;width:100%;
  padding:.85rem 1rem;
  border-radius:10px;
  border:2px solid transparent;
  font-size:1rem;font-weight:600;
  text-align:center;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(155deg,var(--green-bright),var(--green-deep));color:var(--white);box-shadow:0 4px 12px rgba(14,61,31,.35);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:var(--green-deep);box-shadow:0 4px 12px rgba(217,166,0,.35);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--green);color:var(--green);}
.btn-row{display:flex;flex-direction:column;gap:.7rem;}
.btn-link{background:none;border:none;color:var(--ink-soft);font-size:.88rem;text-decoration:underline;padding:.4rem;}

label{display:block;font-size:.82rem;color:var(--ink-soft);margin:.7rem 0 .25rem;}
input,select,textarea{
  width:100%;padding:.65rem .7rem;border:1.5px solid var(--line);
  border-radius:8px;font-size:1rem;background:var(--white);color:var(--ink);
  font-family:inherit;transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(22,101,52,.15);}
.error-msg{color:#b3261e;font-size:.85rem;margin-top:.5rem;min-height:1.1em;}
.back-row{margin-top:.9rem;text-align:center;}

/* ---- ciemny formularz rejestracji ---- */
.login-form{
  display:flex;flex-direction:column;gap:10px;
  max-width:300px;margin:0 auto;padding:20px;
  background:linear-gradient(165deg,#242424,#161616);border-radius:12px;color:#fff;
  font-family:Arial, sans-serif;box-shadow:0 14px 34px rgba(0,0,0,.4);
}
.login-form h2{color:#fff;text-align:center;font-family:Arial, sans-serif;font-size:1.3rem;margin-bottom:4px;}
.login-form input{
  padding:10px;border:none;border-radius:5px;font-size:1rem;
  background:#fff;color:#111;
}
.login-form input:focus{outline:2px solid var(--gold);box-shadow:none;}
.login-form button{
  padding:10px;border:none;border-radius:5px;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:#1e1e1e;font-weight:700;cursor:pointer;font-size:1rem;
  box-shadow:0 4px 12px rgba(217,166,0,.35);
}
.login-form button:hover{filter:brightness(1.06);}
.login-form .signup{color:#ccc;font-size:.85rem;text-align:center;margin:4px 0 0;}
.login-form .signup a{color:var(--gold);text-decoration:underline;}
.login-form .error-msg{color:#ff6b6b;text-align:center;margin:0;}

/* ================= APP (po zalogowaniu) ================= */
#app{display:none;min-height:100svh;background:var(--paper);}
#app.active{display:block;}
.topbar{
  background:linear-gradient(120deg,var(--green-deep),#0a2c17);color:var(--white);
  padding:.9rem 1.1rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;
  box-shadow:0 3px 14px rgba(0,0,0,.25);
}
.topbar-id{display:flex;align-items:center;gap:.6rem;}
.mini-crest{width:32px;height:41px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.topbar-club{font-family:'Oswald';font-size:1.05rem;font-weight:600;letter-spacing:.01em;}
.topbar-role{font-size:.72rem;color:var(--gold);}
.menu-btn{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));border:none;color:var(--green-deep);
  font-size:1.3rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .12s ease;
}
.menu-btn:active{transform:scale(.92);}

.hero-banner{
  position:relative;padding:1.8rem 1.1rem 2.6rem;overflow:hidden;
  background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.18));
}
.pitch-lines{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;}
.hero-banner .float-ball{
  position:absolute;font-size:2.4rem;opacity:.3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
  animation:floaty 4.5s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(18deg)}}
.fb1{top:6%;left:8%;animation-delay:0s;}
.fb2{top:60%;right:10%;animation-delay:1.2s;font-size:1.8rem;}
.fb3{bottom:4%;left:36%;animation-delay:2.1s;font-size:1.4rem;}
.hero-inner{position:relative;z-index:2;color:var(--white);text-align:center;}
.hero-inner .num{font-size:2.6rem;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.3);}
.hero-inner p{margin:.2rem 0 0;font-size:.95rem;opacity:.92;}

.stats-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;
  padding:0 1.1rem;margin-top:-1.6rem;position:relative;z-index:3;
}
.stat-card{
  background:var(--white);border-radius:14px;padding:.85rem .4rem;
  text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.14);
  border-bottom:3px solid var(--gold);
}
.stat-card .num{font-size:1.6rem;color:var(--green);font-weight:600;}
.stat-card .lbl{font-size:.68rem;color:var(--ink-soft);margin-top:.15rem;text-transform:uppercase;letter-spacing:.03em;}

.content{padding:1.4rem 1.1rem 5rem;max-width:640px;margin:0 auto;}
.section-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.25rem;margin-bottom:.9rem;
}
.section-title .sec-ic{font-size:1.25rem;line-height:1;}
.section-title .dash{width:26px;height:5px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:3px;}

@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  background:var(--white);border-radius:14px;padding:1.1rem;
  box-shadow:0 5px 16px rgba(0,0,0,.08);margin-bottom:.9rem;
  border-left:4px solid var(--green);position:relative;
  transition:box-shadow .15s ease, transform .15s ease;
  animation:cardIn .32s ease both;
}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.12);}
.card.gold{border-left-color:var(--gold);}
.card h3{font-size:1.02rem;margin-bottom:.2rem;}
.card .meta{font-size:.78rem;color:var(--ink-soft);}
.pill{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:600;
  padding:.25rem .6rem;border-radius:99px;margin-top:.4rem;
  background:var(--green);color:var(--white);letter-spacing:.02em;
}
.pill.sparing{background:#3f7cac;}
.pill.trening{background:#8a6d1d;}
.pill.wolne{background:#6b6b6b;}
.pill.mecz{background:var(--green);}

.empty{
  text-align:center;padding:2.2rem 1rem;color:var(--ink-soft);
  border:1.5px dashed var(--line);border-radius:14px;font-size:.92rem;
  background:rgba(22,101,52,.03);
}
.empty .empty-ic{display:block;font-size:2.1rem;margin-bottom:.5rem;}

.fab-add{
  position:fixed;right:1.1rem;bottom:1.3rem;z-index:40;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:var(--green-deep);border:none;
  font-size:1.8rem;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .12s ease;
}
.fab-add:active{transform:scale(.92);}

/* nav drawer */
#navOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:49;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
#navOverlay.show{opacity:1;pointer-events:auto;}
#navDrawer{
  position:fixed;top:0;right:0;height:100%;width:min(82vw,320px);
  background:var(--green-deep);z-index:50;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  padding:1.4rem 1.1rem;color:var(--white);overflow-y:auto;
}
#navDrawer.show{transform:translateX(0);}
.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.85rem .6rem;border-radius:10px;
  font-size:1.02rem;color:var(--white);background:none;border:none;
  width:100%;text-align:left;font-family:inherit;
}
.nav-item:active{background:rgba(255,255,255,.08);}
.nav-item .ic{font-size:1.25rem;width:1.5rem;text-align:center;}
.nav-item.active{background:var(--gold);color:var(--green-deep);font-weight:600;}
.nav-close{
  background:none;border:none;color:var(--white);font-size:1.6rem;
  float:right;margin-bottom:.6rem;
}
.nav-foot{margin-top:1.4rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.2);}

/* modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.modal-bg.show{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--paper);width:100%;max-width:480px;
  border-radius:18px 18px 0 0;padding:1.3rem 1.2rem 1.6rem;
  max-height:88vh;overflow-y:auto;
  transform:translateY(30px);transition:transform .25s ease;
}
.modal-box::before{
  content:"";display:block;width:38px;height:4px;border-radius:3px;
  background:var(--line);margin:-.4rem auto 1rem;
}
.modal-bg.show .modal-box{transform:translateY(0);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.modal-head h3{font-size:1.1rem;}
.modal-x{background:none;border:none;font-size:1.4rem;color:var(--ink-soft);}
.field-row{display:flex;gap:.6rem;}
.field-row > div{flex:1;}

/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;}
.cal-nav button{background:var(--green);color:var(--white);border:none;border-radius:8px;padding:.5rem .8rem;font-size:1rem;}
.cal-nav .cal-title{font-family:'Oswald';font-size:1.15rem;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:.68rem;color:var(--ink-soft);padding-bottom:.25rem;}
.cal-day{
  aspect-ratio:1;border-radius:10px;background:var(--white);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:500;border:1.5px solid var(--line);position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .1s ease, box-shadow .1s ease;
}
.cal-day:active{transform:scale(.93);}
.cal-day.empty-cell{background:transparent;border:none;box-shadow:none;}
.cal-day.today{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 3px rgba(244,196,48,.18);}
.cal-day .dot{width:6px;height:6px;border-radius:50%;margin-top:2px;}
.cal-day.mecz{background:#e7f5ec;}
.cal-day.sparing{background:#e6f0f9;}
.cal-day.trening{background:#f7f0da;}
.cal-day.wolne{background:#efefef;}
.year-tabs{display:flex;gap:.5rem;margin-bottom:.7rem;}
.year-tabs button{
  flex:1;padding:.55rem;border-radius:9px;border:1.5px solid var(--line);
  background:var(--white);font-weight:600;color:var(--ink-soft);transition:all .15s ease;
}
.year-tabs button.active{background:linear-gradient(155deg,var(--green-bright),var(--green));color:var(--white);border-color:var(--green);box-shadow:0 3px 10px rgba(22,101,52,.3);}
.month-scroll{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:.6rem;}
.month-chip{
  flex:0 0 auto;padding:.45rem .85rem;border-radius:99px;border:1.5px solid var(--line);
  background:var(--white);font-size:.82rem;white-space:nowrap;transition:all .15s ease;
}
.month-chip.active{background:linear-gradient(155deg,#ffdd66,var(--gold-deep));border-color:var(--gold);color:var(--green-deep);font-weight:600;box-shadow:0 3px 10px rgba(217,166,0,.3);}
.legend{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem;font-size:.75rem;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:.3rem;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;}
.gallery-tile{
  border-radius:14px;overflow:hidden;aspect-ratio:1;position:relative;
  box-shadow:0 6px 16px rgba(0,0,0,.15);background:var(--green);
}
.gallery-tile img{width:100%;height:100%;object-fit:cover;}
.gallery-tile .cap{
  position:absolute;left:0;right:0;bottom:0;padding:.5rem .6rem;
  background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);
  color:var(--white);font-size:.72rem;font-weight:500;
}
.del-btn{
  background:none;border:none;color:#b3261e;font-size:.78rem;
  position:absolute;top:.6rem;right:.6rem;
}

<style>
:root{
  --green-deep:#0e3d1f;
  --green:#166534;
  --green-bright:#1e8a45;
  --gold:#f4c430;
  --gold-deep:#d9a600;
  --paper:#f7f5ee;
  --ink:#0e1f14;
  --ink-soft:#3c4a40;
  --line:#c9c2ab;
  --white:#ffffff;
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1a12;
    --ink:#eef2ea;
    --ink-soft:#aab7ad;
    --line:#2a3b2d;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1a12;
  --ink:#eef2ea;
  --ink-soft:#aab7ad;
  --line:#2a3b2d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1px 1px, rgba(22,101,52,.08) 1px, transparent 0) 0 0/22px 22px,
    var(--paper);
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.num{
  font-family:'Oswald',system-ui,sans-serif;
  letter-spacing:0.01em;
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
.hide{display:none !important;}
img{max-width:100%;display:block;}

/* ---------- pitch background ---------- */
.pitch-bg{
  background:
    repeating-linear-gradient(
      100deg,
      var(--green) 0px, var(--green) 90px,
      var(--green-bright) 90px, var(--green-bright) 180px
    );
  position:relative;
}
.pitch-bg::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(14,61,31,0.15), rgba(14,61,31,0.55));
  pointer-events:none;
}

/* ================= SPLASH / HERO SCENE ================= */
#scene{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:8vh 1.2rem 3rem;
  overflow:hidden;
}
.crest{
  width:84px;height:107px;margin-bottom:.6rem;
  object-fit:contain;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));
}
.club-name{
  color:var(--white);
  text-align:center;
  font-size:clamp(1.6rem,7vw,2.4rem);
  font-weight:700;
  text-transform:none;
  line-height:1.05;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}
.club-sub{
  color:var(--gold);
  font-size:.95rem;
  letter-spacing:.06em;
  margin-top:.35rem;
  font-family:'Oswald',sans-serif;
}
.stage{
  position:relative;
  width:min(90vw,360px);
  height:300px;
  margin-top:2.2rem;
}
#playerSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.stage-caption{
  color:rgba(255,255,255,.75);font-size:.82rem;font-style:italic;
  text-align:center;margin-top:.6rem;letter-spacing:.02em;
}

.eye{transform-box:fill-box;transform-origin:50% 50%;animation:glance 2.6s ease-in-out infinite;}
.eye-right{animation-delay:.05s;}
@keyframes glance{
  0%,55%,100%{transform:translate(0,0)}
  62%{transform:translate(.6px,.9px)}
  75%{transform:translate(-.4px,.4px)}
}

.leg{transform-box:fill-box;transform-origin:50% 0%;}
.leg-left{animation:legL 0.62s ease-in-out infinite;}
.leg-right{animation:legR 0.62s ease-in-out infinite;}
@keyframes legL{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes legR{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-14deg)}}
.torso{animation:bob .62s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

#ballWrap{transform-box:fill-box;transform-origin:50% 50%;animation:juggle 0.62s ease-in-out infinite;}
@keyframes juggle{
  0%{transform:translateY(0) scale(1,1)}
  38%{transform:translateY(-62px) scale(0.97,1.03)}
  72%{transform:translateY(0) scale(1.08,0.9)}
  100%{transform:translateY(0) scale(1,1)}
}
#groundShadow{transition:opacity .3s ease;}

/* faza 1: mocne podbicie – sylwetka znika, "kamera" zostaje tylko na piłce */
.stage.kicking .leg,.stage.kicking .torso{animation:none !important;opacity:0;transform:scale(.9) translateY(10px);transition:opacity .38s ease, transform .38s ease;}
.stage.kicking #groundShadow{opacity:0;}
.stage.kicking #ballWrap{animation:riseZoom .62s cubic-bezier(.22,.7,.3,1) forwards;}
@keyframes riseZoom{
  0%{transform:translate(0,0) scale(1) rotate(0deg)}
  100%{transform:translate(-6px,-120px) scale(1.65) rotate(250deg)}
}

/* faza 2: piłka (sama, w zbliżeniu) opada w dół */
.stage.falling .leg,.stage.falling .torso{opacity:0;}
.stage.falling #groundShadow{opacity:0;}
.stage.falling #ballWrap{animation:fallZoom .68s cubic-bezier(.5,0,.68,1) forwards;}
@keyframes fallZoom{
  0%{transform:translate(-6px,-120px) scale(1.65) rotate(250deg)}
  100%{transform:translate(0,0) scale(1) rotate(430deg)}
}

/* faza 3: odbicie od ziemi – dokładnie wtedy pojawia się panel logowania */
.stage.bouncing .leg,.stage.bouncing .torso{opacity:0;}
.stage.bouncing #groundShadow{opacity:1;}
.stage.bouncing #ballWrap{animation:bounceImpact .5s cubic-bezier(.3,1.4,.4,1) forwards;}
@keyframes bounceImpact{
  0%{transform:translate(0,0) scale(1,1) rotate(430deg)}
  22%{transform:translate(0,3px) scale(1.2,.76) rotate(438deg)}
  55%{transform:translate(0,-15px) scale(.92,1.08) rotate(450deg)}
  100%{transform:translate(0,0) scale(1,1) rotate(460deg)}
}

.stage.settled .leg,.stage.settled .torso{opacity:0;}
.stage.settled #groundShadow{opacity:1;}
.stage.settled #ballWrap{animation:idleFloat 1.7s ease-in-out infinite;}
@keyframes idleFloat{0%,100%{transform:translate(0,0) rotate(460deg)}50%{transform:translate(0,-5px) rotate(460deg)}}

#gate{
  width:min(94vw,380px);
  margin-top:1.6rem;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .5s ease, transform .5s ease;
}
#gate.show{opacity:1;transform:translateY(0);}

.ticket{
  background:var(--paper);
  border-radius:16px;
  padding:1.3rem 1.2rem 1.4rem;
  box-shadow:0 14px 34px rgba(0,0,0,.32);
  position:relative;
  border-top:3px solid var(--gold);
}
.ticket::before,.ticket::after{
  content:"";position:absolute;top:50%;width:18px;height:18px;
  background:#0e3d1f;border-radius:50%;transform:translateY(-50%);
}
.ticket::before{left:-9px;}
.ticket::after{right:-9px;}
.ticket + .ticket{margin-top:1rem;}
.gate-title{
  font-size:1.05rem;font-weight:600;color:var(--ink);
  text-align:center;margin-bottom:1rem;
}
.btn{
  display:block;width:100%;
  padding:.85rem 1rem;
  border-radius:10px;
  border:2px solid transparent;
  font-size:1rem;font-weight:600;
  text-align:center;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(155deg,var(--green-bright),var(--green-deep));color:var(--white);box-shadow:0 4px 12px rgba(14,61,31,.35);}
.btn-primary:hover{filter:brightness(1.08);}
.btn-gold{background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:var(--green-deep);box-shadow:0 4px 12px rgba(217,166,0,.35);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--green);color:var(--green);}
.btn-row{display:flex;flex-direction:column;gap:.7rem;}
.btn-link{background:none;border:none;color:var(--ink-soft);font-size:.88rem;text-decoration:underline;padding:.4rem;}

label{display:block;font-size:.82rem;color:var(--ink-soft);margin:.7rem 0 .25rem;}
input,select,textarea{
  width:100%;padding:.65rem .7rem;border:1.5px solid var(--line);
  border-radius:8px;font-size:1rem;background:var(--white);color:var(--ink);
  font-family:inherit;transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(22,101,52,.15);}
.error-msg{color:#b3261e;font-size:.85rem;margin-top:.5rem;min-height:1.1em;}
.back-row{margin-top:.9rem;text-align:center;}

/* ---- ciemny formularz rejestracji ---- */
.login-form{
  display:flex;flex-direction:column;gap:10px;
  max-width:300px;margin:0 auto;padding:20px;
  background:linear-gradient(165deg,#242424,#161616);border-radius:12px;color:#fff;
  font-family:Arial, sans-serif;box-shadow:0 14px 34px rgba(0,0,0,.4);
}
.login-form h2{color:#fff;text-align:center;font-family:Arial, sans-serif;font-size:1.3rem;margin-bottom:4px;}
.login-form input{
  padding:10px;border:none;border-radius:5px;font-size:1rem;
  background:#fff;color:#111;
}
.login-form input:focus{outline:2px solid var(--gold);box-shadow:none;}
.login-form button{
  padding:10px;border:none;border-radius:5px;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:#1e1e1e;font-weight:700;cursor:pointer;font-size:1rem;
  box-shadow:0 4px 12px rgba(217,166,0,.35);
}
.login-form button:hover{filter:brightness(1.06);}
.login-form .signup{color:#ccc;font-size:.85rem;text-align:center;margin:4px 0 0;}
.login-form .signup a{color:var(--gold);text-decoration:underline;}
.login-form .error-msg{color:#ff6b6b;text-align:center;margin:0;}

/* ================= APP (po zalogowaniu) ================= */
#app{display:none;min-height:100svh;background:var(--paper);}
#app.active{display:block;}
.topbar{
  background:linear-gradient(120deg,var(--green-deep),#0a2c17);color:var(--white);
  padding:.9rem 1.1rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:30;
  box-shadow:0 3px 14px rgba(0,0,0,.25);
}
.topbar-id{display:flex;align-items:center;gap:.6rem;}
.mini-crest{width:32px;height:41px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.topbar-club{font-family:'Oswald';font-size:1.05rem;font-weight:600;letter-spacing:.01em;}
.topbar-role{font-size:.72rem;color:var(--gold);}
.menu-btn{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));border:none;color:var(--green-deep);
  font-size:1.3rem;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .12s ease;
}
.menu-btn:active{transform:scale(.92);}

.hero-banner{
  position:relative;padding:1.8rem 1.1rem 2.6rem;overflow:hidden;
  background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.18));
}
.pitch-lines{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;}
.hero-banner .float-ball{
  position:absolute;font-size:2.4rem;opacity:.3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
  animation:floaty 4.5s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(18deg)}}
.fb1{top:6%;left:8%;animation-delay:0s;}
.fb2{top:60%;right:10%;animation-delay:1.2s;font-size:1.8rem;}
.fb3{bottom:4%;left:36%;animation-delay:2.1s;font-size:1.4rem;}
.hero-inner{position:relative;z-index:2;color:var(--white);text-align:center;}
.hero-inner .num{font-size:2.6rem;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.3);}
.hero-inner p{margin:.2rem 0 0;font-size:.95rem;opacity:.92;}

.stats-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;
  padding:0 1.1rem;margin-top:-1.6rem;position:relative;z-index:3;
}
.stat-card{
  background:var(--white);border-radius:14px;padding:.85rem .4rem;
  text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.14);
  border-bottom:3px solid var(--gold);
}
.stat-card .num{font-size:1.6rem;color:var(--green);font-weight:600;}
.stat-card .lbl{font-size:.68rem;color:var(--ink-soft);margin-top:.15rem;text-transform:uppercase;letter-spacing:.03em;}

.content{padding:1.4rem 1.1rem 5rem;max-width:640px;margin:0 auto;}
.section-title{
  display:flex;align-items:center;gap:.5rem;
  font-size:1.25rem;margin-bottom:.9rem;
}
.section-title .sec-ic{font-size:1.25rem;line-height:1;}
.section-title .dash{width:26px;height:5px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));border-radius:3px;}

@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{
  background:var(--white);border-radius:14px;padding:1.1rem;
  box-shadow:0 5px 16px rgba(0,0,0,.08);margin-bottom:.9rem;
  border-left:4px solid var(--green);position:relative;
  transition:box-shadow .15s ease, transform .15s ease;
  animation:cardIn .32s ease both;
}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.12);}
.card.gold{border-left-color:var(--gold);}
.card h3{font-size:1.02rem;margin-bottom:.2rem;}
.card .meta{font-size:.78rem;color:var(--ink-soft);}
.pill{
  display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:600;
  padding:.25rem .6rem;border-radius:99px;margin-top:.4rem;
  background:var(--green);color:var(--white);letter-spacing:.02em;
}
.pill.sparing{background:#3f7cac;}
.pill.trening{background:#8a6d1d;}
.pill.wolne{background:#6b6b6b;}
.pill.mecz{background:var(--green);}

.empty{
  text-align:center;padding:2.2rem 1rem;color:var(--ink-soft);
  border:1.5px dashed var(--line);border-radius:14px;font-size:.92rem;
  background:rgba(22,101,52,.03);
}
.empty .empty-ic{display:block;font-size:2.1rem;margin-bottom:.5rem;}

.fab-add{
  position:fixed;right:1.1rem;bottom:1.3rem;z-index:40;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(155deg,#ffdd66,var(--gold-deep));color:var(--green-deep);border:none;
  font-size:1.8rem;box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .12s ease;
}
.fab-add:active{transform:scale(.92);}

/* nav drawer */
#navOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:49;opacity:0;pointer-events:none;transition:opacity .25s ease;
}
#navOverlay.show{opacity:1;pointer-events:auto;}
#navDrawer{
  position:fixed;top:0;right:0;height:100%;width:min(82vw,320px);
  background:var(--green-deep);z-index:50;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  padding:1.4rem 1.1rem;color:var(--white);overflow-y:auto;
}
#navDrawer.show{transform:translateX(0);}
.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.85rem .6rem;border-radius:10px;
  font-size:1.02rem;color:var(--white);background:none;border:none;
  width:100%;text-align:left;font-family:inherit;
}
.nav-item:active{background:rgba(255,255,255,.08);}
.nav-item .ic{font-size:1.25rem;width:1.5rem;text-align:center;}
.nav-item.active{background:var(--gold);color:var(--green-deep);font-weight:600;}
.nav-close{
  background:none;border:none;color:var(--white);font-size:1.6rem;
  float:right;margin-bottom:.6rem;
}
.nav-foot{margin-top:1.4rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.2);}

/* modal */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.modal-bg.show{opacity:1;pointer-events:auto;}
.modal-box{
  background:var(--paper);width:100%;max-width:480px;
  border-radius:18px 18px 0 0;padding:1.3rem 1.2rem 1.6rem;
  max-height:88vh;overflow-y:auto;
  transform:translateY(30px);transition:transform .25s ease;
}
.modal-box::before{
  content:"";display:block;width:38px;height:4px;border-radius:3px;
  background:var(--line);margin:-.4rem auto 1rem;
}
.modal-bg.show .modal-box{transform:translateY(0);}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;}
.modal-head h3{font-size:1.1rem;}
.modal-x{background:none;border:none;font-size:1.4rem;color:var(--ink-soft);}
.field-row{display:flex;gap:.6rem;}
.field-row > div{flex:1;}

/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;}
.cal-nav button{background:var(--green);color:var(--white);border:none;border-radius:8px;padding:.5rem .8rem;font-size:1rem;}
.cal-nav .cal-title{font-family:'Oswald';font-size:1.15rem;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:.68rem;color:var(--ink-soft);padding-bottom:.25rem;}
.cal-day{
  aspect-ratio:1;border-radius:10px;background:var(--white);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:500;border:1.5px solid var(--line);position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.05);transition:transform .1s ease, box-shadow .1s ease;
}
.cal-day:active{transform:scale(.93);}
.cal-day.empty-cell{background:transparent;border:none;box-shadow:none;}
.cal-day.today{border-color:var(--gold);border-width:2px;box-shadow:0 0 0 3px rgba(244,196,48,.18);}
.cal-day .dot{width:6px;height:6px;border-radius:50%;margin-top:2px;}
.cal-day.mecz{background:#e7f5ec;}
.cal-day.sparing{background:#e6f0f9;}
.cal-day.trening{background:#f7f0da;}
.cal-day.wolne{background:#efefef;}
.year-tabs{display:flex;gap:.5rem;margin-bottom:.7rem;}
.year-tabs button{
  flex:1;padding:.55rem;border-radius:9px;border:1.5px solid var(--line);
  background:var(--white);font-weight:600;color:var(--ink-soft);transition:all .15s ease;
}
.year-tabs button.active{background:linear-gradient(155deg,var(--green-bright),var(--green));color:var(--white);border-color:var(--green);box-shadow:0 3px 10px rgba(22,101,52,.3);}
.month-scroll{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.6rem;margin-bottom:.6rem;}
.month-chip{
  flex:0 0 auto;padding:.45rem .85rem;border-radius:99px;border:1.5px solid var(--line);
  background:var(--white);font-size:.82rem;white-space:nowrap;transition:all .15s ease;
}
.month-chip.active{background:linear-gradient(155deg,#ffdd66,var(--gold-deep));border-color:var(--gold);color:var(--green-deep);font-weight:600;box-shadow:0 3px 10px rgba(217,166,0,.3);}
.legend{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.8rem;font-size:.75rem;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:.3rem;}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;}
.gallery-tile{
  border-radius:14px;overflow:hidden;aspect-ratio:1;position:relative;
  box-shadow:0 6px 16px rgba(0,0,0,.15);background:var(--green);
}
.gallery-tile img{width:100%;height:100%;object-fit:cover;}
.gallery-tile .cap{
  position:absolute;left:0;right:0;bottom:0;padding:.5rem .6rem;
  background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);
  color:var(--white);font-size:.72rem;font-weight:500;
}
.del-btn{
  background:none;border:none;color:#b3261e;font-size:.78rem;
  position:absolute;top:.6rem;right:.6rem;
}
.small-note{font-size:.78rem;color:var(--ink-soft);margin-top:-.3rem;margin-bottom:.9rem;}
.file-picker{
  border:2px dashed var(--line);border-radius:12px;padding:1.4rem 1rem;
  text-align:center;cursor:pointer;background:rgba(22,101,52,.03);transition:border-color .15s ease;
}
.file-picker:hover{border-color:var(--green);}
.file-picker input[type=file]{display:none;}
.file-picker .fp-icon{font-size:1.8rem;}
.file-picker .fp-text{font-size:.85rem;color:var(--ink-soft);margin-top:.3rem;}
</style>
</head>
